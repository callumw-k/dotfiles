onboarding = false

[terminal]
new_cwd = "follow"

[keys]
new_workspace = ["prefix+shift+n", "alt+w"]
new_tab = ["prefix+c", "alt+t"]
new_pane = ["prefix+enter", "alt+n"]

arrangement_next = ["prefix+]", "alt+]"]
arrangement_previous = ["prefix+[", "alt+["]

next_workspace = ["prefix+shift+]", "alt+shift+]"]
previous_workspace = ["prefix+shift+[", "alt+shift+["]

focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]

previous_agent = ["prefix+shift+k", "alt+shift+k"]
next_agent = ["prefix+shift+j", "alt+shift+j"]

close_pane = ["prefix+x", "ctrl+q"]
zoom = ["prefix+z", "alt+m"]
split_horizontal = ["prefix+minus", "prefix+d"]
workspace_picker = ["prefix+w", "alt+s"]

resize_mode = ["prefix+r", "ctrl+n"]
toggle_float = "alt+f"
goto = ["prefix+g", "alt+shift+p"]

rename_tab = ["prefix+shift+t", "alt+shift+r"]
rename_pane = ["prefix+shift+p", "alt+r"]




[keys.indexed]
agents = "alt"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
floating_pane_width = "90%"
floating_pane_height = "90%"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "activity", bold = true }],
  [{ text = "  " }, { token = "state_text", dim = true }],
]

[ui.sidebar.spaces]
divider = false
row_gap = 1

[theme]
name = "terminal"
auto_switch = false

